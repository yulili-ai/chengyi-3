name: Deploy Chengyi to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - css/**
      - js/**
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare public static files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js assets _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/js/main.js
          test -f _site/assets/video/enter.mp4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
